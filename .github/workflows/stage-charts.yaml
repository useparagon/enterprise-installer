# Package charts to ECR, then call release-charts to publish the same .tgz files to S3.
# Chart templates come from chart_ref (or this workflow's ref); fixtures come from the release tag.
name: Stage Charts
run-name: Stage Charts - ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Paragon release tag (e.g. 2026.0528.1501-2b7d0d71). Stamps __PARAGON_VERSION__
          and loads charts/files/service-inputs.json from this tag.
        required: true
        type: string
      chart_ref:
        description: >
          Git ref for chart templates (branch or SHA). Defaults to the ref that
          started this workflow (use your feature branch when dispatching from it).
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  package:
    name: Package Helm Charts
    uses: ./.github/workflows/package-charts.yaml
    with:
      version: ${{ inputs.version }}
      chart_ref: ${{ inputs.chart_ref }}

  push-ecr:
    name: Push Helm Charts to ECR
    needs: package
    runs-on:
      - self-hosted
      - self-hosted-lite
    env:
      ECR_REGISTRY: 055987364777.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY_PREFIX: paragon-ci
      AWS_REGION: us-east-1

    steps:
      # Ephemeral runners already start empty; this avoids leftover *.tgz if a
      # workspace is ever reused between jobs.
      - name: Clear leftover chart packages
        run: rm -rf "$GITHUB_WORKSPACE/dist-helm"

      - name: Download packaged charts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: helm-packages
          path: dist-helm

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.1

      # GitHub-hosted: OIDC → role. Local act: pass -s ACT_AWS_ACCESS_KEY_ID / -s ACT_AWS_SECRET_ACCESS_KEY
      # (and optional -s ACT_AWS_SESSION_TOKEN) for an IAM principal that can push to this ECR registry.
      - name: Configure AWS credentials (OIDC)
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: enterprise-chart-stage
          role-to-assume: arn:aws:iam::055987364777:role/helm-repo-manager

      - name: Configure AWS credentials (act — access keys)
        if: ${{ env.ACT }}
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.ACT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACT_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.ACT_AWS_SESSION_TOKEN }}

      # catthehacker/ubuntu:js-22.04 has no aws CLI; ubuntu-latest on GitHub does
      - name: Ensure AWS CLI is installed
        run: |
          if command -v aws >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y awscli
          else
            apt-get update -qq
            apt-get install -y awscli
          fi
          aws --version

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push charts to ECR
        run: |
          set -euo pipefail
          pkg_dir="$GITHUB_WORKSPACE/dist-helm"
          shopt -s nullglob
          tgz_files=("$pkg_dir"/*.tgz)
          if [ "${#tgz_files[@]}" -eq 0 ]; then
            echo "Error: no packaged charts found in $pkg_dir" >&2
            exit 1
          fi
          cd "$pkg_dir"

          dest="oci://${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}"
          for tgz in "${tgz_files[@]}"; do
            echo "Pushing $(basename "$tgz") -> $dest (Helm maps chart name under ${ECR_REPOSITORY_PREFIX}/)"
            helm push "$tgz" "$dest"
          done

  publish-production:
    name: Publish Production Helm Charts
    needs: push-ecr
    uses: ./.github/workflows/release-charts.yaml
    with:
      version: ${{ inputs.version }}
      chart_ref: ${{ inputs.chart_ref }}
      skip_package: true
    permissions:
      id-token: write
      contents: read
      actions: write
