
# Default values for grafana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# SQLite cannot accept concurrent writers. Keep a single replica.
replicaCount: 1

image:
  repository: useparagon/grafana
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

service:
  type: ClusterIP
  port: 4500

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: false
  # minReplicas: 1
  # maxReplicas: 1
  # targetCPUUtilizationPercentage: 75
  # targetMemoryUtilizationPercentage: 75

imagePullSecrets: []
nameOverride: ''
fullnameOverride: 'grafana'

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  certificate: ''
  enabled: true
  className: ''
  host: '' # When empty, will use chart name + domain
  healthcheck_path: /api/health

nodeSelector: {}

tolerations: []

affinity: {}

tls_secret: ''

secretName: "paragon-secrets"

# Grafana 12 contends on sqlite at boot. WAL + retries let overlapping
# writers wait instead of failing provisioning immediately.
envKeys:
  - GF_DATABASE_WAL
  - GF_DATABASE_QUERY_RETRIES
  - GF_DATABASE_TRANSACTION_RETRIES
env:
  GF_DATABASE_WAL: "true"
  GF_DATABASE_QUERY_RETRIES: "50"
  GF_DATABASE_TRANSACTION_RETRIES: "50"
