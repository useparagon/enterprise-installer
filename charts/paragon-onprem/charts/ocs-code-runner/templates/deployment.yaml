{{- if eq .Values.mode "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocs-code-runner.fullname" . }}
  labels:
    {{- include "ocs-code-runner.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.autoscaling .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocs-code-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := dict -}}
      {{- if and .Values.global (kindIs "map" .Values.global) (hasKey .Values.global "podAnnotations") (kindIs "map" .Values.global.podAnnotations) -}}
      {{- $podAnnotations = merge $podAnnotations .Values.global.podAnnotations -}}
      {{- end -}}
      {{- if .Values.podAnnotations -}}
      {{- $podAnnotations = merge $podAnnotations .Values.podAnnotations -}}
      {{- end -}}
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ocs-code-runner.selectorLabels" . | nindent 8 }}
    spec:
      {{- $pullSecrets := include "paragon.imagePullSecrets" (dict "root" .) -}}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- $pullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ocs-code-runner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "paragon.image" (dict "root" . "repository" .Values.image.repository "tag" .Values.image.tag) | quote }}
          imagePullPolicy: {{ include "paragon.imagePullPolicy" (dict "root" .) }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "ocs-code-runner.containerEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
