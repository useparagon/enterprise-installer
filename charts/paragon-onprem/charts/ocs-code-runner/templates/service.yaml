{{- if eq .Values.mode "deployment" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocs-code-runner.fullname" . }}
  labels:
    {{- include "ocs-code-runner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Port 80 so the in-cluster URL matches Knative's cluster-local ksvc
    # (`http://ocs-code-runner.<ns>.svc.cluster.local`) without a port suffix.
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ocs-code-runner.selectorLabels" . | nindent 4 }}
{{- end }}
