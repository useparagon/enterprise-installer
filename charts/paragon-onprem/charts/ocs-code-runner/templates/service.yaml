{{/*
ClusterIP in front of the ksvc pods. Workers resolve
http://ocs-code-runner — a same-namespace A record, not
Knative's ExternalName CNAME to kourier-internal (Node getaddrinfo ENOTFOUND).
Keep minScale >= 1 so this Service has endpoints; scale-to-zero has no pods.

targetPort MUST be queue-proxy 8012 (same as the Knative revision Service),
not user-container 8080. Hitting 8080 skips queue-proxy, so request metrics,
concurrency, and autoscaling never see worker traffic.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocs-code-runner.fullname" . }}
  labels:
    {{- include "ocs-code-runner.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # Port 80 so WORKER_SHARED_OCS_KNATIVE_SERVICE_URL needs no suffix.
    - port: 80
      targetPort: 8012
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: {{ include "ocs-code-runner.ksvcName" . }}
