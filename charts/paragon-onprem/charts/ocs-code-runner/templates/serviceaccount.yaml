{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ocs-code-runner.serviceAccountName" . }}
  labels:
    {{- include "ocs-code-runner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- $pullSecrets := include "paragon.imagePullSecrets" (dict "root" .) -}}
{{- if $pullSecrets }}
imagePullSecrets:
  {{- $pullSecrets | nindent 2 }}
{{- end }}
{{- end }}
