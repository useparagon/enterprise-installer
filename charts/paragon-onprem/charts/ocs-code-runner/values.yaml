# OCS knative node-script code runner (on-prem substitute for AWS Lambda).
# Emits a serving.knative.dev/v1 Service. Requires Knative Serving + Kourier.

image:
  # Docker Hub equivalent of ocs/knative-node-script. Independent of Paragon VERSION.
  repository: useparagon/ocs-code-runner-knative
  pullPolicy: IfNotPresent
  tag: latest

service:
  port: 8080

resources:
  limits:
    cpu: '1'
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

knative:
  minScale: '0'
  maxScale: '10'
  target: '20'
  containerConcurrency: 20
  timeoutSeconds: 600

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ocs-code-runner

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
