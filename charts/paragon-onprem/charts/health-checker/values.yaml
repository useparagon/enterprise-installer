# Default values for health-checker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: useparagon/health-checker
  pullPolicy: IfNotPresent
  tag: '2026.1006.1943-a7252668'

service:
  type: ClusterIP
  port: 1733

resources:
  limits:
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 100Mi

pdb:
  enabled: true
  # Single replica: allow voluntary disruption for rollouts, drains, and restart cron.
  maxUnavailable: 1

autoscaling:
  enabled: false

secretName: "paragon-secrets"

secretKeys:
  - CACHE_REDIS_URL
  - CERBERUS_POSTGRES_DATABASE
  - CERBERUS_POSTGRES_HOST
  - CERBERUS_POSTGRES_PASSWORD
  - CERBERUS_POSTGRES_PORT
  - CERBERUS_POSTGRES_USERNAME
  - CLOUD_STORAGE_MICROSERVICE_PASS
  - CLOUD_STORAGE_MICROSERVICE_USER
  - EVENT_LOGS_POSTGRES_DATABASE
  - EVENT_LOGS_POSTGRES_HOST
  - EVENT_LOGS_POSTGRES_PASSWORD
  - EVENT_LOGS_POSTGRES_PORT
  - EVENT_LOGS_POSTGRES_USERNAME
  - HERMES_POSTGRES_DATABASE
  - HERMES_POSTGRES_HOST
  - HERMES_POSTGRES_PASSWORD
  - HERMES_POSTGRES_PORT
  - HERMES_POSTGRES_USERNAME
  - PHEME_POSTGRES_DATABASE
  - PHEME_POSTGRES_HOST
  - PHEME_POSTGRES_PASSWORD
  - PHEME_POSTGRES_PORT
  - PHEME_POSTGRES_USERNAME
  - QUEUE_REDIS_URL
  - SYSTEM_REDIS_URL
  - TRIGGERKIT_POSTGRES_DATABASE
  - TRIGGERKIT_POSTGRES_HOST
  - TRIGGERKIT_POSTGRES_PASSWORD
  - TRIGGERKIT_POSTGRES_PORT
  - TRIGGERKIT_POSTGRES_USERNAME
  - WORKFLOW_REDIS_URL
  - ZEUS_POSTGRES_DATABASE
  - ZEUS_POSTGRES_HOST
  - ZEUS_POSTGRES_PASSWORD
  - ZEUS_POSTGRES_PORT
  - ZEUS_POSTGRES_USERNAME

# Keep envKeys/secretKeys aligned with health-checker config.yaml and chart/values.yaml.
envKeys:
  - ACCOUNT_PRIVATE_URL
  - API_TRIGGERKIT_PRIVATE_URL
  - AWS_REGION
  - AZURE_CLIENT_ID
  - AZURE_TENANT_ID
  - GOOGLE_CLOUD_PROJECT
  - CACHE_REDIS_CLUSTER_ENABLED
  - CACHE_REDIS_TLS_ENABLED
  - CERBERUS_POSTGRES_SSL_ENABLED
  - CERBERUS_PRIVATE_URL
  - CLOUD_STORAGE_COMPLIANCE_BUCKET
  - CLOUD_STORAGE_POLL_INTERVAL_MS
  - CLOUD_STORAGE_PUBLIC_BUCKET
  - CLOUD_STORAGE_REGION
  - CLOUD_STORAGE_SYSTEM_BUCKET
  - CLOUD_STORAGE_TYPE
  - CONNECT_PRIVATE_URL
  - DASHBOARD_PRIVATE_URL
  - EVENT_LOGS_POSTGRES_SSL_ENABLED
  - HADES_PRIVATE_URL
  - HEALTH_CHECKER_PORT
  - HEALTH_CHECKER_PRIVATE_URL
  - HERMES_POSTGRES_SSL_ENABLED
  - HERMES_PRIVATE_URL
  - HOST_ENV
  - PASSPORT_PRIVATE_URL
  - PHEME_POSTGRES_SSL_ENABLED
  - PHEME_PRIVATE_URL
  - QUEUE_REDIS_CLUSTER_ENABLED
  - QUEUE_REDIS_TLS_ENABLED
  - RELEASE_PRIVATE_URL
  - SYSTEM_REDIS_CLUSTER_ENABLED
  - SYSTEM_REDIS_TLS_ENABLED
  - TRIGGERKIT_POSTGRES_SSL_ENABLED
  - WORKER_ACTIONKIT_PRIVATE_URL
  - WORKER_ACTIONS_PRIVATE_URL
  - WORKER_AUDIT_LOGS_PRIVATE_URL
  - WORKER_CREDENTIALS_PRIVATE_URL
  - WORKER_CRONS_PRIVATE_URL
  - WORKER_DEPLOYMENTS_PRIVATE_URL
  - WORKER_EVENT_LOGS_PRIVATE_URL
  - WORKER_PROXY_PRIVATE_URL
  - WORKER_TRIGGERKIT_PRIVATE_URL
  - WORKER_TRIGGERS_PRIVATE_URL
  - WORKER_WORKFLOWS_PRIVATE_URL
  - WORKFLOW_REDIS_CLUSTER_ENABLED
  - WORKFLOW_REDIS_TLS_ENABLED
  - ZEUS_POSTGRES_SSL_ENABLED
  - ZEUS_PRIVATE_URL

imagePullSecrets: []
nameOverride: ''
fullnameOverride: 'health-checker'

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podSecurityContext:
  {}
# fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

ingress:
  certificate: ''
  enabled: true
  className: ''
  host: '' # When empty, will use chart name + domain
  healthcheck_path: /healthz
  include_annotations: true

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: useparagon.com/capacityType
          operator: In
          values:
          - ondemand

tls_secret: ''
