
subchart:
  fluent-bit:
    enabled: true
  openobserve:
    enabled: true

# Parent values replace subchart tolerations entirely — keep the subchart
# catch-all plus Agent OS (logging chart v1.0.1).
fluent-bit:
  tolerations:
    - operator: Exists
    - key: useparagon.com/workload
      operator: Exists
      effect: NoSchedule

global:
  # Optional private registry / Artifactory proxy (prepended to image repository paths).
  imageRegistry: ""
  # When set (including ""), rewrites useparagon/ prefix in repository paths. Omit to preserve useparagon/.
  # imageRepositoryPrefix: null
  migrationImageRegistry: ""
  imagePullSecrets: []
  pullPolicy: IfNotPresent
  testImage:
    repository: busybox
    tag: latest
  kubectlImage:
    repository: alpine/kubectl
    tag: "1.36.2"
  namespace: paragon
  env: {}
