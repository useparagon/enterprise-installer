global:
  env:
    # Paragon release version. Example: 2025.0903.0729-7d7d9767
    VERSION: "your-paragon-version"

    # Licensing credentials provided by Paragon.
    LICENSE: "your-license"
    # LICENSE_CONFIG: "your-license-config"

    # Feature flag service storage configuration.
    FLIPT_STORAGE_TYPE: local
    FLIPT_STORAGE_LOCAL_PATH: /etc/flipt

    # Grafana Postgres storage alerts (PARA-25692). Unset = Grafana 1000 GiB default; 0 disables.
    # HERMES_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"
    # CERBERUS_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"
    # ZEUS_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"
    # PHEME_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"
    # EVENT_LOGS_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"
    # TRIGGERKIT_POSTGRES_MAX_STORAGE_BYTES: "1073741824000"

    # Route Grafana alerts labeled team:platform (storage alerts) to Slack.
    # MONITOR_GRAFANA_SLACK_TEAM_CHANNELS: "platform=<slack-channel-id>"

# Optional examples. Uncomment to customize per chart.
# subchart:
#   cache-replay:
#     enabled: false
#   health-checker:
#     enabled: false
#   kafka-exporter:
#     enabled: false

# Optional example for per-service resource tuning.
# hades:
#   resources:
#     limits:
#       cpu: 1000m
#       memory: 3Gi
#     requests:
#       cpu: 500m
#       memory: 3Gi
